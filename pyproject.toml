[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-minder-plugin"
version = "0.1.0"
description = "A Minder plugin."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "you" }]

# The SDK is the only required dependency. Until it's on PyPI, install from git.
# Add your own runtime deps here too (e.g. "httpx>=0.27").
dependencies = [
    "minder-plugin-sdk @ git+https://github.com/minderhq/plugin-sdk@v0.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "black>=24", "flake8>=7", "mypy>=1.8"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
