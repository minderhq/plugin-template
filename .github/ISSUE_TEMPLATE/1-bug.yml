name: Bug report
description: Report a defect in the template itself — existing behavior is wrong or broken
title: "[bug]: "
type: Bug
labels: ["status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        This is for problems with the **template repo itself** (its scaffolding, CI, docs) —
        not for bugs in a plugin you built *from* this template.
  - type: textarea
    id: description
    attributes:
      label: What's wrong?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
    validations:
      required: true
