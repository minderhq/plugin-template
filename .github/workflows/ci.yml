name: CI

on:
  push:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  pull_request:
    branches: [main]
    paths-ignore: [ '**/*.md' ]
  workflow_dispatch:

# Cancel a superseded run of THIS workflow on the same ref instead of piling
# a redundant one onto whatever runner pool this repo (or a fork of it) uses.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Shared lint -> type-check -> test pipeline (always GitHub-hosted):
    # minderhq/.github/.github/workflows/python-ci.yml. Repo-specific checks
    # that need the installed environment are passed in below.
    uses: minderhq/.github/.github/workflows/python-ci.yml@main
    with:
      # The scaffold's own plugin and the manifest+webhook example
      # (examples/webhook_manifest.yaml) must both pass the contract validator.
      pre-test-run: |
        minder-plugin validate plugin.py
        minder-plugin validate examples/webhook_manifest.yaml
