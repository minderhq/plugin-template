name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          black --check .
          flake8 --max-line-length=100 --extend-ignore=E203,W503 .
      - name: Validate against the plugin contract
        run: minder-plugin validate plugin.py
      - name: Test
        run: pytest -q
